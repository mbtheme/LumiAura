<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============ RESET & BASE ============ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    /* ============ SERVICES SECTION ============ */
    .services-section {
      width: 100%;
      height: 100vh;
      min-height: 600px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Grille 2x2 */
    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      flex: 1;
      width: 100%;
    }

    /* ============ SERVICE CARD ============ */
    .service-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Image de fond */
    .service-card__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .service-card:hover .service-card__bg {
      transform: scale(1.08);
    }

    /* Overlay coloré */
    .service-card__overlay {
      position: absolute;
      inset: 0;
      transition: opacity 0.4s ease;
    }

    /* Couleurs d'overlay pour chaque carte */
    .service-card:nth-child(1) .service-card__overlay {
      background: linear-gradient(135deg, rgba(88, 28, 120, 0.72) 0%, rgba(45, 27, 105, 0.78) 100%);
    }

    .service-card:nth-child(2) .service-card__overlay {
      background: linear-gradient(135deg, rgba(20, 60, 80, 0.78) 0%, rgba(30, 50, 70, 0.82) 100%);
    }

    .service-card:nth-child(3) .service-card__overlay {
      background: linear-gradient(135deg, rgba(70, 30, 100, 0.72) 0%, rgba(40, 20, 80, 0.80) 100%);
    }

    .service-card:nth-child(4) .service-card__overlay {
      background: linear-gradient(135deg, rgba(60, 30, 110, 0.72) 0%, rgba(35, 25, 90, 0.78) 100%);
    }

    .service-card:hover .service-card__overlay {
      opacity: 0.88;
    }

    /* Contenu centré */
    .service-card__content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .service-card:hover .service-card__content {
      transform: translateY(-16px);
    }

    /* Icône */
    .service-card__icon {
      width: 40px;
      height: 40px;
      margin-bottom: 14px;
      stroke: #fff;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.4s ease;
    }

    .service-card:hover .service-card__icon {
      transform: scale(1.1);
    }

    /* Titre */
    .service-card__title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: none;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Lien "En savoir plus" - caché par défaut */
    .service-card__link {
      position: absolute;
      bottom: 28%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 3;
      white-space: nowrap;
    }

    .service-card__link svg {
      width: 14px;
      height: 14px;
      stroke: #fff;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s ease;
    }

    .service-card:hover .service-card__link {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .service-card__link:hover svg {
      transform: translateX(4px);
    }

    /* ============ BOTTOM BAR ============ */
    .services-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 30px;
      background: linear-gradient(to top, rgba(0,0,0,0.3) 0%, transparent 100%);
    }

    .services-bottom__text {
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* Icône scroll (souris) */
    .scroll-icon {
      width: 20px;
      height: 32px;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      position: relative;
      display: flex;
      justify-content: center;
      padding-top: 6px;
    }

    .scroll-icon__wheel {
      width: 2px;
      height: 6px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 1px;
      animation: scrollBounce 1.8s ease-in-out infinite;
    }

    @keyframes scrollBounce {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(6px); opacity: 0.3; }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 768px) {
      .services-grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 1fr);
      }

      .services-section {
        height: auto;
        min-height: 100vh;
      }

      .service-card {
        min-height: 220px;
      }

      .service-card__title {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- ==================== SERVICES SECTION ==================== -->
  <!-- Copiez tout le contenu de cette section pour l'intégrer -->
  <section class="services-section">
    <div class="services-grid">

      <!-- Carte 1: Nettoyage de vitres -->

      <!-- Carte 3: Nettoyage du revêtement -->
      <div class="service-card">
        <img class="service-card__bg" src="images/nettoyage-revetement.jpg" alt="Nettoyage du revêtement">
        <div class="service-card__overlay"></div>
        <div class="service-card__content">
          <svg class="service-card__icon" viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>

          <h3 class="service-card__title">Nettoyage du revêtement</h3>
        </div>
        <a href="#" class="service-card__link">

          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>

      </div>

      <!-- Carte 4: Nettoyage à pression -->
      <div class="service-card">
        <img class="service-card__bg" src="images/nettoyage-pression.jpg" alt="Nettoyage à pression">

          <svg class="service-card__icon" viewBox="0 0 24 24">

            <path d="M2 12c0-2 1.5-3 3-3s3 1 3 3-1.5 3-3 3-3-1-3-3z" opacity="0.5"/>
            <path d="M16 12c0-2 1.5-3 3-3s3 1 3 3-1.5 3-3 3-3-1-3-3z" opacity="0.5"/>
          </svg>
          <h3 class="service-card__title">Nettoyage à pression</h3>
        </div>
        <a href="#" class="service-card__link">
          En savoir plus
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>

    </div>

    <!-- Barre inférieure -->
    <div class="services-bottom">
      <span class="services-bottom__text">DÉCOUVRIR NOS SERVICES</span>
      <div class="scroll-icon">
        <div class="scroll-icon__wheel"></div>
      </div>
    </div>
  </section>
  <!-- ==================== END SERVICES SECTION ==================== -->

</body>
</html>
